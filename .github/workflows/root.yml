name: ios-root

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "iPhone X (D22AP) iOS 16 IPSW URL"
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      size:
        description: "HFS+ root image size (on7xelte USERDATA p21 = 15497936384 bytes)"
        default: "20G"
      trim:
        description: "Trim profile passed as TRIM to mkiosroot-staged.sh (on7xelte or empty)"
        default: ""

# The root image is several GiB: the download of the APFS components plus the
# output has to fit on the runner disk, so this job runs alone.
concurrency:
  group: ios-root
  cancel-in-progress: false

jobs:
  root:
    # macos-15 currently maps to the arm64 runner: 320 GiB disk, ~46 GiB free.
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          # hdiutil/newfs_hfs are native; rsync from Homebrew handles -H and
          # --numeric-ids more reliably than the bundled openrsync.
          brew install rsync
          command -v hdiutil newfs_hfs rsync python3
          df -h /

      - name: Build the HFS+ root
        run: |
          set -eux
          mkdir -p work
          TRIM="${{ inputs.trim }}" bash tools/mkiosroot-staged.sh work "${{ inputs.ipsw_url }}" work/ios-root.img "${{ inputs.size }}"
          ls -la work/ios-root.img

      - name: Verify ownership and content
        run: |
          set -eux
          mkdir -p work/verify
          hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage \
            -mountpoint work/verify work/ios-root.img
          mount | grep -i hfs
          echo "--- top level ---"
          ls -ln work/verify | head -30
          echo "--- key paths ---"
          sudo stat -f '%u:%g %Sp %N' work/verify/Applications work/verify/System \
            work/verify/usr/lib/dyld \
            work/verify/private/var/keybags/systembag.kb
          echo "--- dyld cache ---"
          ls -ln work/verify/System/Library/Caches/com.apple.dyld | head -10
          echo "--- cryptexes ---"
          sudo du -sh work/verify/private/preboot/Cryptexes/OS work/verify/private/preboot/Cryptexes/App
          echo "--- sizes ---"
          sudo du -sh work/verify
          df -h work/verify
          echo "--- fallback sample ---"
          ls -ln work/verify/private/preboot/Cryptexes/OS/usr/libexec || true
          hdiutil detach work/verify

      - name: Compress and split for the microSD transfer
        run: |
          set -eux
          # FAT32 on the microSD cannot hold a >4 GiB file; the gzip stream is
          # split into 2 GiB parts and reassembled on the phone with
          #   cat part* | gzip -dc | dd of=<userdata block device>
          gzip -1 -c work/ios-root.img > work/ios-root.img.gz
          split -b 2G -d -a 3 work/ios-root.img.gz work/ios-root.img.gz.part
          (cd work && shasum -a 256 ios-root.img ios-root.img.gz ios-root.img.gz.part* \
            > SHA256SUMS)
          ls -la work/ios-root.img.gz work/ios-root.img.gz.part* work/SHA256SUMS
          du -sh work/ios-root.img.gz
          df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-root
          path: |
            work/ios-root.img.gz.part*
            work/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
