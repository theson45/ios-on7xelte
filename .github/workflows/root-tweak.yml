name: ios-root-tweak

# Apply tools/sweet-root-tweaks.py to an ios-root image built earlier
# (root.yml) instead of rebuilding it from the IPSW. Only the 128 MiB chunks
# that changed are uploaded (gzip), with the per-chunk SHA-256 of the whole
# new image, so the phone side can write just the chunks that differ.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "root.yml run that holds the ios-root artifact"
        default: "42526101397"
      base_sha256:
        description: "SHA-256 of ios-root.img in that artifact"
        default: "52fec8bc052d5022063e1db7492e3e2210fb3d05e2e2d1fabd57763d98862689"
      hal_plugin:
        description: "install the RedwoodAudio HAL plug-in and keep VirtualAudio (xnu 0158)"
        type: boolean
        default: true
      wifi_fw:
        description: "install the BCM43430A1 firmware + NVRAM for the kernel's Wi-Fi (on7xelte W3)"
        type: boolean
        default: true
      runner:
        description: GitHub runner label (macos-15-intel when arm64 runners are out of capacity)
        default: macos-15

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-root
  cancel-in-progress: false

jobs:
  tweak:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-root
          path: work/in
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack and verify the base image
        run: |
          set -euxo pipefail
          ls -la work/in
          cat work/in/ios-root.img.gz.part* | gzip -dc > work/ios-root.img
          rm -rf work/in
          echo "${{ inputs.base_sha256 }}  work/ios-root.img" | shasum -a 256 -c
          python3 tools/chunk-sums.py work/ios-root.img > work/base.sums
          df -h /

      - name: Build the RedwoodAudio HAL plug-in
        if: ${{ inputs.hal_plugin }}
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="$(xcrun --sdk iphoneos --find clang) -isysroot $SDK -arch arm64 -miphoneos-version-min=16.0"
          mkdir -p work/plugin
          $CC -O2 -Wall -bundle -framework CoreFoundation -o work/plugin/RedwoodAudio tools/RedwoodAudio/audio_plugin.c
          codesign -f -s - work/plugin/RedwoodAudio
          cp tools/RedwoodAudio/audio_plugin.plist work/plugin/RedwoodAudio.plist
          file work/plugin/RedwoodAudio
          plutil -lint work/plugin/RedwoodAudio.plist

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.hal_plugin }}
        with:
          name: RedwoodAudio
          path: work/plugin
          retention-days: 14

      # The phone's own Android Wi-Fi files, from the public on7xelte vendor tree at a fixed commit,
      # checked by hash; they only pass through the runner into the image, never into this repository.
      - name: Fetch the Wi-Fi firmware
        if: ${{ inputs.wifi_fw }}
        run: |
          set -eux
          V=https://raw.githubusercontent.com/DevOtag-Open-Source/android_vendor_samsung_on7xelte/9e3f643a14b641638d87c076daa3e3a22d4dc950/proprietary/etc/wifi
          mkdir -p work/wifi
          curl -fsSL --retry 5 -o work/wifi/bcmdhd_sta.bin "$V/bcmdhd_sta.bin"
          curl -fsSL --retry 5 -o work/wifi/nvram_net.txt "$V/nvram_net.txt"
          shasum -a 256 -c <<'SUMS'
          47ce52e9b2c5c39da006b79a1f35dfbd98cc1837e384b486ec581ea5703f850b  work/wifi/bcmdhd_sta.bin
          61cba5c6a52e2265633ddcf480b246031944f3f3561c60adb3cc36efa508fb0f  work/wifi/nvram_net.txt
          SUMS

      - name: Apply the tweaks
        run: |
          set -eux
          mkdir -p work/root
          plug=""
          if [ "${{ inputs.hal_plugin }}" = "true" ]; then plug="--hal-plugin work/plugin"; fi
          if [ "${{ inputs.wifi_fw }}" = "true" ]; then plug="$plug --wifi-fw work/wifi"; fi
          hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage \
            -mountpoint work/root work/ios-root.img
          sudo python3 tools/sweet-root-tweaks.py work/root $plug | tee work/tweak.log
          if [ "${{ inputs.wifi_fw }}" = "true" ]; then
            grep -q 'bcm43430a1-sdio.bin' work/tweak.log
            sudo ls -lnR work/root/usr/share/firmware/wifi/on7xelte
          fi
          if [ "${{ inputs.hal_plugin }}" = "true" ]; then
            grep -q 'RedwoodAudio.driver installed' work/tweak.log
            sudo ls -lnR work/root/System/Library/Audio/Plug-Ins/HAL/RedwoodAudio.driver
            sudo ls -ln work/root/Library/Audio/Plug-Ins/HAL
          fi
          grep -q 'disabled job .* fairplayd.H2$' work/tweak.log
          grep -q 'disabled job .* bluetoothd$' work/tweak.log
          sudo ls -ln work/root/System/Library/xpc
          sudo plutil -p work/root/private/var/mobile/Library/Preferences/com.apple.purplebuddy.plist
          sync
          hdiutil detach work/root
          dev=$(hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage -nomount work/ios-root.img |
                awk 'NR==1{print $1}')
          sudo fsck_hfs -f -n "$dev"
          hdiutil detach "$dev"

      - name: Changed chunks
        run: |
          set -euxo pipefail
          mkdir -p work/out
          python3 tools/chunk-sums.py work/ios-root.img > work/out/chunks.sums
          shasum -a 256 work/ios-root.img | awk '{print $1}' > work/out/image.sha256
          python3 - work/ios-root.img work/base.sums work/out <<'PY'
          import gzip, sys
          img, base, out = sys.argv[1:]
          CH = 128 << 20
          old = [l.split()[1] for l in open(base)]
          new = [l.split()[1] for l in open(out + "/chunks.sums")]
          changed = [i for i, (a, b) in enumerate(zip(old, new)) if a != b]
          print("changed chunks:", changed)
          with open(img, "rb") as f:
              for i in changed:
                  f.seek(i * CH)
                  with open(f"{out}/c{i}.gz", "wb") as g:
                      g.write(gzip.compress(f.read(CH), 1))
          PY
          ls -la work/out
          du -sh work/out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-root-tweak
          path: work/out
          retention-days: 14
          compression-level: 0
